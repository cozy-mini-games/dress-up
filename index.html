<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbe4ec">
<title>換裝小屋</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="換裝小屋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;flex-direction:column;height:100dvh;
    background:#fdf3f6;color:#7a4b5c;
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  }
  header{padding:10px 16px 4px;display:flex;align-items:center;justify-content:space-between;}
  header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:1px;}
  #save{border:0;border-radius:999px;padding:8px 14px;background:#f29bb4;color:#fff;font-size:14px;font-weight:600;}
  #save:active,#install:active{transform:scale(.95);}
  .hbtns{display:flex;gap:6px;}
  #install{border:2px solid #f29bb4;border-radius:999px;padding:6px 12px;background:#fff;color:#d76b8f;font-size:14px;font-weight:600;display:none;}
  #about{border:0;background:none;color:#c08aa0;font-size:20px;padding:4px 2px;}
  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:#fff;color:#c2557b;font-weight:700;padding:10px 16px;border-radius:14px;box-shadow:0 4px 14px #d76b8f33;transition:transform .35s;z-index:20;}
  #toast.show{transform:translate(-50%,0);}
  .sheet,#sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:30;}
  .sheet.show,#sheet.show{display:flex;}
  .sheet>div,#sheet>div{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));color:#7a4b5c;line-height:1.7;font-size:15px;}
  .sheet p{margin:0 0 10px;}
  .sheet h2,#sheet h2{margin:0 0 8px;font-size:18px;color:#d76b8f;}
  #sheet ol{margin:0;padding-left:22px;}
  .sheet button,#sheet button{margin-top:14px;width:100%;border:0;border-radius:14px;padding:12px;background:#f29bb4;color:#fff;font-size:16px;font-weight:700;}

  #stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 0;}
  #doll{position:relative;height:100%;aspect-ratio:400/600;max-width:92vw;border-radius:24px;transition:background .3s;}
  #doll{overflow:visible;touch-action:manipulation;cursor:pointer;}
  #char{position:absolute;left:0;top:3%;width:100%;height:97%;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite;}
  #char img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;}
  #char img[src=""]{display:none;}
  #L-face{opacity:0;}
  #L-face.show{opacity:1;}
  @keyframes breathe{50%{transform:scale(1.008,1.018);}}
  #char.jump{animation:jump .55s cubic-bezier(.3,.7,.4,1);}
  @keyframes jump{0%{transform:scale(1.06,.92);}35%{transform:translateY(-12%) scale(.96,1.05);}65%{transform:translateY(0) scale(1.05,.94);}100%{transform:none;}}
  #char.pat{animation:pat .7s ease;}
  @keyframes pat{0%,100%{transform:none;}20%{transform:scale(1.05,.93) rotate(-2deg);}45%{transform:scale(.98,1.03) rotate(2deg);}70%{transform:scale(1.03,.96) rotate(-1deg);}}
  #char.spin{animation:spin .6s ease-in-out;}
  @keyframes spin{0%{transform:scaleX(1);}25%{transform:scaleX(-1) translateY(-4%);}50%{transform:scaleX(1) translateY(-6%);}75%{transform:scaleX(-1) translateY(-3%);}100%{transform:scaleX(1);}}
  #char.shy{animation:shy .9s ease;}
  @keyframes shy{0%,100%{transform:none;}30%,70%{transform:rotate(-4deg) scale(.98);}}

  #bubble{position:absolute;left:50%;top:-1%;transform:translate(-50%,-6px) scale(.6);opacity:0;
    background:#fff;color:#c2557b;font-weight:700;font-size:16px;padding:8px 14px;border-radius:18px;white-space:nowrap;
    box-shadow:0 3px 0 #f3c6d5;transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:5;}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff;border-bottom:0;}
  #bubble.show{opacity:1;transform:translate(-50%,0) scale(1);}
  .fx{position:absolute;pointer-events:none;font-size:22px;z-index:4;animation:fly 1.1s ease-out forwards;}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r));opacity:0;}}
  #hint{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-size:12px;color:#c08aa0;background:#fff8;padding:3px 10px;border-radius:99px;pointer-events:none;transition:opacity .5s;}

  nav{display:flex;gap:6px;padding:6px 12px 0;}
  nav button{flex:1;border:0;border-radius:14px 14px 0 0;padding:10px 0;font-size:15px;font-weight:600;background:#f6dbe4;color:#a4708a;}
  nav button.on{background:#fff;color:#d76b8f;}
  nav button:disabled{opacity:.45;}
  #panel{background:#fff;padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;min-height:120px;}
  .item{aspect-ratio:1;border:3px solid transparent;border-radius:16px;background:#fdf3f6;display:flex;align-items:center;justify-content:center;padding:6px;}
  .item img{max-width:100%;max-height:100%;min-width:0;}
  body{overflow-x:hidden;}
  .item.on{border-color:#f29bb4;background:#fde6ee;}
  .item .none{font-size:13px;color:#b98ca0;}
  .swatch{width:70%;height:70%;border-radius:50%;box-shadow:inset 0 0 0 2px #0001;}
</style>
</head>
<body>
  <header>
    <h1>換裝小屋</h1>
    <div class="hbtns"><button id="about" aria-label="關於">ⓘ</button><button id="install">下載 App</button><button id="save">存成照片</button></div>
  </header>

  <div id="stage">
    <div id="doll">
      <div id="char">
        <img id="L-base" src="img/base.png" alt="Q 版小人">
        <img id="L-clothes" src="" alt="">
        <img id="L-face" src="img/face/blink.png" alt="">
      </div>
      <div id="bubble"></div>
      <div id="hint">點點她、摸摸頭看看 ♡</div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="sheet"><div>
    <h2>把換裝小屋放到主畫面</h2>
    <ol id="sheetSteps"></ol>
    <button id="sheetOk">知道了</button>
  </div></div>

  <div id="aboutSheet" class="sheet"><div>
    <h2>關於換裝小屋</h2>
    <p>這是一個<b>個人製作、非營利</b>的小遊戲，做來送給朋友玩，不收費、不放廣告，也不會用於任何商業用途。</p>
    <p>遊戲中的人物、髮型與服裝為本作者使用 AI 繪圖工具生成後自行修改的原創素材，並非任何現有作品的角色。</p>
    <p>如果你認為本站有任何內容侵犯了你的權利，請聯絡作者，我會盡快處理或移除。</p>
    <button id="aboutOk">知道了</button>
  </div></div>

  <nav id="tabs"></nav>
  <div id="panel"></div>

<script>
// ===== 素材清單：之後加新衣服、新髮型只要在這裡加一行 =====
const CATS = [
  { id: 'clothes', name: '衣服', soon: true, items: [] },
  { id: 'bg', name: '背景', items: [
      { id: 'pink', color: '#fbe4ec' }, { id: 'mint', color: '#d9f0e6' }, { id: 'sky', color: '#dcecfb' },
      { id: 'lemon', color: '#fdf3cf' }, { id: 'lilac', color: '#ebe1f7' }, { id: 'peach', color: '#fde3d3' },
      { id: 'white', color: '#ffffff' }, { id: 'night', color: '#3d3550' },
  ]},
];

const store = {
  get(){ try { return JSON.parse(localStorage.getItem('dressup') || '{}'); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem('dressup', JSON.stringify(v)); } catch(e){} },
};
const pick = Object.assign({ bg: 'pink' }, store.get());
let tab = 'bg';
const $ = id => document.getElementById(id);

function find(cat, id){ return CATS.find(c => c.id === cat).items.find(i => i.id === id); }

function render(){
  $('doll').style.background = (find('bg', pick.bg) || {}).color || '#fbe4ec';

  $('tabs').innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.soon ? c.name + '（準備中）' : c.name;
    b.className = c.id === tab ? 'on' : '';
    b.disabled = !!c.soon;
    b.onclick = () => { tab = c.id; render(); };
    $('tabs').appendChild(b);
  });

  const cat = CATS.find(c => c.id === tab);
  $('panel').innerHTML = '';
  cat.items.forEach(it => {
    const d = document.createElement('div');
    d.className = 'item' + (pick[cat.id] === it.id ? ' on' : '');
    if (it.icon) d.innerHTML = `<img src="${it.icon}" alt="">`;
    else if (it.color) d.innerHTML = `<div class="swatch" style="background:${it.color}"></div>`;
    else d.innerHTML = `<span class="none">${it.name || '無'}</span>`;
    d.onclick = () => {
      if (pick[cat.id] === it.id) return;
      pick[cat.id] = it.id; store.set(pick); render();
      react(cat.id);
    };
    $('panel').appendChild(d);
  });
}

$('save').onclick = async () => {
  const W = 800, H = 1200, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = $('doll').style.background || '#fbe4ec'; g.fillRect(0, 0, W, H);
  for (const id of ['L-base', 'L-clothes']) {
    const el = $(id);
    if (!el.getAttribute('src')) continue;
    await (el.complete ? Promise.resolve() : new Promise(r => el.onload = r));
    g.drawImage(el, 0, 0, W, H);
  }
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], '換裝小屋.png', { type: 'image/png' });
  // 手機：跳出分享選單，可以選「儲存到相簿」或傳給朋友
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '換裝小屋' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // 電腦或不支援分享：直接下載
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.download = '換裝小屋.png'; a.href = url; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('照片存好了 ♡');
};

// ===== 互動：眨眼、點她、摸頭、換裝反應、發呆時說話 =====
const LINES = {
  head:  ['嘿嘿～', '好舒服～', '再摸一下嘛', '喜歡被摸頭♡', '呼嚕嚕～'],
  body:  ['好癢！', '哇！', '嘻嘻', '陪我玩～', '跳跳！'],
  clothes: ['好看嗎？', '換新衣服囉！', '這件我喜歡～', '轉一圈給你看！'],
  bg:    ['這裡好漂亮～', '換個地方玩！', '哇～'],
  idle:  ['在發呆嗎？', '點點我嘛～', '今天想穿什麼呢？', '摸摸我的頭嘛～'],
  many:  ['不要一直戳啦！', '好啦好啦～', '頭暈了…'],
};
const rnd = a => a[Math.floor(Math.random() * a.length)];
const face = $('L-face'), ch = $('char'), doll = $('doll');
let faceUntil = 0, lastTouch = Date.now(), taps = [];

function setFace(kind, ms){
  face.src = 'img/face/' + kind + '.png';
  face.classList.add('show');
  faceUntil = Date.now() + ms;
  setTimeout(() => { if (Date.now() >= faceUntil) face.classList.remove('show'); }, ms);
}
function anim(name){
  ch.style.animation = 'none'; void ch.offsetWidth; ch.style.animation = '';
  ch.className = name;
  clearTimeout(anim.t); anim.t = setTimeout(() => ch.className = '', 950);
}
function say(text){
  const b = $('bubble'); b.textContent = text; b.classList.add('show');
  clearTimeout(say.t); say.t = setTimeout(() => b.classList.remove('show'), 1800);
}
function burst(x, y, chars, n){
  for (let i = 0; i < n; i++){
    const e = document.createElement('div');
    e.className = 'fx'; e.textContent = rnd(chars);
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.color = rnd(['#f27ea4', '#f6a5c0', '#ffb3c7', '#f9c74f', '#b8a0f0']);
    const ang = -Math.PI / 2 + (Math.random() - .5) * 2.2, d = 60 + Math.random() * 60;
    e.style.setProperty('--dx', Math.cos(ang) * d + 'px');
    e.style.setProperty('--dy', Math.sin(ang) * d + 'px');
    e.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
    doll.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
}
function buzz(){ try { navigator.vibrate && navigator.vibrate(15); } catch(e){} }

function react(kind, x, y){
  lastTouch = Date.now(); $('hint').style.opacity = 0;
  const r = doll.getBoundingClientRect();
  if (x === undefined){ x = r.width / 2; y = r.height * .3; }
  if (kind === 'clothes'){ anim('spin'); setFace('happy', 1300); say(rnd(LINES.clothes)); burst(x, y, ['✦', '✧', '♡'], 8); }
  else if (kind === 'bg'){ anim('jump'); setFace('happy', 900); say(rnd(LINES.bg)); burst(x, y, ['✦', '✧'], 6); }
}

doll.addEventListener('pointerdown', ev => {
  const r = doll.getBoundingClientRect();
  const x = ev.clientX - r.left, y = ev.clientY - r.top, fy = y / r.height;
  if (fy > .95) return;
  buzz(); lastTouch = Date.now(); $('hint').style.opacity = 0;
  taps = taps.filter(t => Date.now() - t < 2500); taps.push(Date.now());
  if (taps.length >= 6){ taps = []; anim('shy'); setFace('blink', 1200); say(rnd(LINES.many)); burst(x, y, ['💫', '✧'], 5); return; }
  if (fy < .5){ anim('pat'); setFace('happy', 1200); say(rnd(LINES.head)); burst(x, y, ['♥', '♡', '❤'], 7); }
  else { anim('jump'); setFace('happy', 700); say(rnd(LINES.body)); burst(x, y, ['✦', '♪', '♡'], 6); }
});

// 自然眨眼
(function blinkLoop(){
  setTimeout(() => {
    if (Date.now() > faceUntil){
      setFace('blink', 130);
      if (Math.random() < .25) setTimeout(() => setFace('blink', 120), 260);
    }
    blinkLoop();
  }, 2200 + Math.random() * 3200);
})();

// 太久沒理她，她會自己說話
setInterval(() => {
  if (Date.now() - lastTouch > 14000){ lastTouch = Date.now(); say(rnd(LINES.idle)); anim('jump'); }
}, 2000);

// 預先載入表情圖，避免第一次眨眼閃一下
['blink', 'happy'].forEach(k => { const i = new Image(); i.src = 'img/face/' + k + '.png'; });

render();
setTimeout(() => { say('嗨～今天想怎麼打扮我？'); setFace('happy', 1200); }, 600);

// ===== 像 App 一樣安裝 + 自動更新 =====
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2600); }
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;
if (!standalone) $('install').style.display = 'block';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').style.display = 'block'; });
addEventListener('appinstalled', () => { $('install').style.display = 'none'; toast('裝好了！去主畫面找我 ♡'); });
$('install').onclick = async () => {
  if (deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; return; }
  $('sheetSteps').innerHTML = isIOS
    ? '<li>用 <b>Safari</b> 打開這個網頁</li><li>按下面中間的「分享」按鈕（方框加向上箭頭）</li><li>往下滑，選「<b>加入主畫面</b>」</li><li>按右上角「新增」</li>'
    : '<li>用 <b>Chrome</b> 打開這個網頁</li><li>按右上角「⋮」（三個點）</li><li>選「<b>加到主畫面</b>」或「<b>安裝應用程式</b>」</li><li>按「安裝」或「新增」</li>';
  $('sheet').classList.add('show');
};
$('sheetOk').onclick = () => $('sheet').classList.remove('show');
$('about').onclick = () => $('aboutSheet').classList.add('show');
$('aboutOk').onclick = () => $('aboutSheet').classList.remove('show');

if ('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    setInterval(check, 60 * 1000);
  });
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    sessionStorage.setItem('justUpdated', '1');
    location.reload();
  });
  if (sessionStorage.getItem('justUpdated')){ sessionStorage.removeItem('justUpdated'); setTimeout(() => toast('已更新到最新版 ♡'), 400); }
}
</script>
</body>
</html>
