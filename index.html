<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e4">
<title>幸運籤餅</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幸運籤餅">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;
    background:#fff4e4;color:#8a5a3c;
    font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    background-image:radial-gradient(#f9e2c4 1.5px,transparent 1.5px);background-size:22px 22px;
  }
  button{font-family:inherit;}
  header{padding:12px 16px 4px;display:flex;align-items:center;gap:8px;}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:1px;flex:1;}
  .pill{border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;background:#fff;color:#c98652;box-shadow:0 2px 0 #f0d3ae;}
  #streak{background:#ffe3c2;color:#b8692f;box-shadow:none;}
  #about{background:none;box-shadow:none;font-size:18px;padding:4px;color:#d3a47c;}
  #install{display:none;}

  main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;}
  #hint{font-size:16px;font-weight:700;color:#b77a4d;margin-bottom:6px;min-height:24px;text-align:center;}
  #left{font-size:13px;color:#c99a76;margin-top:4px;}

  #stage{position:relative;width:min(78vw,330px);aspect-ratio:240/200;cursor:pointer;touch-action:manipulation;}
  #plate{position:absolute;left:6%;right:6%;bottom:0;height:22%;border-radius:50%;background:#fff;box-shadow:0 6px 0 #f1d6b4, inset 0 -6px 0 #f7ead8;}
  #cookie{position:absolute;inset:0 0 8% 0;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%;}
  #cookie svg{width:100%;height:100%;overflow:visible;}
  @keyframes idle{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-4%) rotate(-1.5deg);}}
  #cookie.shake{animation:shake .35s ease;}
  @keyframes shake{0%,100%{transform:none;}20%{transform:rotate(-6deg) scale(1.03);}50%{transform:rotate(5deg) scale(.98);}80%{transform:rotate(-3deg);}}
  .half{transition:transform .7s cubic-bezier(.2,.9,.3,1.2), opacity .7s;}
  #cookie.open{animation:none;}
  #cookie.open .hl{transform:translate(-14%,4%) rotate(-22deg);}
  #cookie.open .hr{transform:translate(14%,4%) rotate(22deg);}
  #cookie.open .face,#cookie.open .crack{opacity:0;}
  .crack{opacity:0;transition:opacity .15s;}
  .crack.on{opacity:1;}
  .face{transition:opacity .2s;}

  #slip{position:absolute;left:50%;top:44%;width:40%;height:12%;transform:translate(-50%,-50%) scale(.3);opacity:0;background:#fffdf8;border:2px solid #f1d1ad;border-radius:4px;
    transition:all .6s cubic-bezier(.3,1.4,.5,1) .25s;}
  #slip.show{opacity:1;transform:translate(-50%,-150%) scale(1) rotate(-4deg);}

  .fx{position:absolute;pointer-events:none;font-size:20px;z-index:4;animation:fly 1.1s ease-out forwards;}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.4);opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--r));opacity:0;}}

  /* 籤詩卡 */
  #card{position:absolute;left:50%;top:50%;width:min(88vw,360px);transform:translate(-50%,-45%) scale(.7);opacity:0;pointer-events:none;
    background:#fffdf8;border-radius:22px;padding:22px 20px 16px;box-shadow:0 8px 0 #f1d6b4,0 14px 30px #c9874a33;
    transition:all .45s cubic-bezier(.3,1.5,.5,1);z-index:6;}
  #card.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;}
  #card::before{content:"";position:absolute;inset:8px;border:2px dashed #f3d9bb;border-radius:16px;pointer-events:none;}
  .lv{display:inline-block;font-size:22px;font-weight:900;padding:4px 18px;border-radius:999px;color:#fff;letter-spacing:4px;}
  .lv1{background:#f27e7e;}.lv2{background:#f5a35c;}.lv3{background:#e7c04a;}.lv4{background:#8cc787;}.lv5{background:#8fb4e3;}
  .no{float:right;font-size:12px;color:#d1aa86;margin-top:8px;}
  #ftext{font-size:18px;line-height:1.7;font-weight:700;color:#7a4b30;margin:14px 2px 14px;text-align:center;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;}
  .box{background:#fff4e4;border-radius:12px;padding:8px 10px;}
  .box b{display:block;font-size:11px;color:#c99a76;font-weight:600;margin-bottom:2px;}
  .box span{font-size:15px;font-weight:800;color:#8a5a3c;}
  .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px;box-shadow:inset 0 0 0 1.5px #0001;}
  #task{grid-column:1/3;display:flex;align-items:center;gap:8px;cursor:pointer;}
  #task .ck{width:22px;height:22px;border-radius:7px;border:2.5px solid #e2b68b;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:900;}
  #task.done .ck{background:#8cc787;border-color:#8cc787;color:#fff;}
  #task.done span{text-decoration:line-through;opacity:.6;}
  .btns{display:flex;gap:8px;margin-top:14px;}
  .btns button{flex:1;border:0;border-radius:14px;padding:12px 4px;font-size:15px;font-weight:800;}
  .b1{background:#f5a35c;color:#fff;box-shadow:0 3px 0 #d9823b;}
  .b2{background:#ffe3c2;color:#b8692f;box-shadow:0 3px 0 #f0c99b;}
  .btns button:active,.pill:active{transform:translateY(2px);box-shadow:none;}
  .btns button:disabled{opacity:.45;}

  footer{display:flex;gap:10px;justify-content:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom));}
  footer button{border:0;border-radius:16px;padding:12px 18px;font-size:15px;font-weight:800;background:#fff;color:#b8692f;box-shadow:0 3px 0 #f0d3ae;}

  /* 底部彈出面板 */
  .sheet{position:fixed;inset:0;background:#5a3a2466;display:none;align-items:flex-end;z-index:30;}
  .sheet.show{display:flex;}
  .sheet>div{background:#fffdf8;width:100%;max-height:82dvh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));line-height:1.7;font-size:15px;}
  .sheet h2{margin:0 0 4px;font-size:19px;color:#c4733a;}
  .sheet .sub{font-size:13px;color:#c99a76;margin-bottom:12px;}
  .sheet .close{margin-top:14px;width:100%;border:0;border-radius:14px;padding:12px;background:#f5a35c;color:#fff;font-size:16px;font-weight:800;}
  .bar{height:10px;border-radius:9px;background:#f6e3cb;overflow:hidden;margin-bottom:14px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#f7b267,#f27e7e);border-radius:9px;}
  #book{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
  .slot{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;}
  .slot.no{background:#f4e6d4;color:#d9bfa2;font-size:18px;}
  .slot small{font-size:10px;opacity:.9;font-weight:600;}
  #peek{margin-top:12px;background:#fff4e4;border-radius:14px;padding:12px;font-weight:700;color:#7a4b30;display:none;}
  #toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:#fff;color:#c4733a;font-weight:800;padding:10px 16px;border-radius:14px;box-shadow:0 4px 14px #c9874a33;transition:transform .35s;z-index:40;white-space:nowrap;}
  #toast.show{transform:translate(-50%,0);}
</style>
</head>
<body>
  <header>
    <h1>幸運籤餅</h1>
    <span class="pill" id="streak">🔥 1 天</span>
    <button class="pill" id="install">下載 App</button>
    <button class="pill" id="about" aria-label="關於">ⓘ</button>
  </header>

  <main>
    <div id="hint">點點籤餅，把它敲開！</div>
    <div id="stage">
      <div id="plate"></div>
      <div id="slip"></div>
      <div id="cookie">
        <svg viewBox="0 0 240 180" aria-label="籤餅">
          <defs>
            <linearGradient id="dough" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd58a"/><stop offset=".6" stop-color="#f1b25c"/><stop offset="1" stop-color="#df9543"/></linearGradient>
            <clipPath id="cl"><polygon points="-40,-40 120,-40 120,34 110,60 128,84 110,102 128,120 112,140 120,200 -40,200"/></clipPath>
            <clipPath id="cr"><polygon points="280,-40 119,-40 119,34 109,60 127,84 109,102 127,120 111,140 119,200 280,200"/></clipPath>
            <g id="body">
              <path d="M20 112 C 20 54 70 34 120 34 C 170 34 220 54 220 112 C 220 150 176 162 120 162 C 64 162 20 150 20 112 Z" fill="url(#dough)" stroke="#b8742f" stroke-width="3" stroke-linejoin="round"/>
              <path d="M34 128 C 70 146 170 146 206 128" fill="none" stroke="#c98340" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
              <path d="M30 120 C 22 112 22 100 28 92 M210 120 C 218 112 218 100 212 92" fill="none" stroke="#c98340" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
              <path d="M46 74 C 58 56 80 46 104 46" fill="none" stroke="#fff3d6" stroke-width="5" stroke-linecap="round" opacity=".8"/>
              <g fill="#d48c42" opacity=".6"><circle cx="58" cy="128" r="2"/><circle cx="74" cy="140" r="1.6"/><circle cx="178" cy="132" r="2"/><circle cx="194" cy="118" r="1.6"/><circle cx="66" cy="96" r="1.4"/></g>
            </g>
          </defs>
          <g class="half hl" style="transform-origin:120px 150px"><use href="#body" clip-path="url(#cl)"/></g>
          <g class="half hr" style="transform-origin:120px 150px"><use href="#body" clip-path="url(#cr)"/></g>
          <g class="face">
            <ellipse cx="82" cy="104" rx="6.5" ry="8" fill="#5a3320"/><circle cx="84" cy="101" r="2.4" fill="#fff"/>
            <ellipse cx="158" cy="104" rx="6.5" ry="8" fill="#5a3320"/><circle cx="160" cy="101" r="2.4" fill="#fff"/>
            <ellipse cx="66" cy="120" rx="11" ry="6" fill="#f48d7c" opacity=".55"/><ellipse cx="174" cy="120" rx="11" ry="6" fill="#f48d7c" opacity=".55"/>
            <path d="M110 116 Q 115 122 120 116 Q 125 122 130 116" fill="none" stroke="#5a3320" stroke-width="2.6" stroke-linecap="round"/>
          </g>
          <path class="crack c1" d="M120 36 L 110 60 L 128 84" fill="none" stroke="#7a4a20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="crack c2" d="M128 84 L 110 102 L 128 120 L 112 140" fill="none" stroke="#7a4a20" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div id="left"></div>

    <div id="card">
      <span class="lv" id="flv">大吉</span><span class="no" id="fno">No.01</span>
      <div id="ftext"></div>
      <div class="grid">
        <div class="box"><b>幸運色</b><span id="fcolor"></span></div>
        <div class="box"><b>幸運數字</b><span id="fnum"></span></div>
        <div class="box" style="grid-column:1/3"><b>幸運小物</b><span id="fitem"></span></div>
        <div class="box" id="task"><div class="ck">✓</div><div><b>今日小任務</b><span id="ftask"></span></div></div>
      </div>
      <div class="btns">
        <button class="b2" id="share">存成圖片</button>
        <button class="b1" id="again">再開一顆</button>
      </div>
    </div>
  </main>

  <footer>
    <button id="openBook">📖 籤詩收藏冊</button>
    <button id="openToday">📜 今天的籤</button>
  </footer>

  <div class="sheet" id="bookSheet"><div>
    <h2>籤詩收藏冊</h2>
    <div class="sub" id="bookSub"></div>
    <div class="bar"><i id="bookBar"></i></div>
    <div id="book"></div>
    <div id="peek"></div>
    <button class="close" data-close>關閉</button>
  </div></div>

  <div class="sheet" id="todaySheet"><div>
    <h2>今天抽到的籤</h2>
    <div class="sub">每天可以開 3 顆，午夜 12 點補充</div>
    <div id="todayList"></div>
    <button class="close" data-close>關閉</button>
  </div></div>

  <div class="sheet" id="aboutSheet"><div>
    <h2>關於幸運籤餅</h2>
    <p>每天敲開籤餅，抽一張可愛的小籤詩。每天可以開 3 顆，收集全部 60 張籤詩吧！</p>
    <p>這是個人製作、非營利的小遊戲，不收費、不放廣告。籤詩內容只是好玩，不是真的占卜喔。</p>
    <div id="installSteps"></div>
    <button class="close" data-close>知道了</button>
  </div></div>

  <div id="toast"></div>

<script src="fortunes.js"></script>
<script>
const $ = id => document.getElementById(id);
const PER_DAY = 3;
const LV = ['', '大吉', '中吉', '小吉', '吉', '末吉'];
const LVC = ['', '#f27e7e', '#f5a35c', '#e7c04a', '#8cc787', '#8fb4e3'];

// ===== 存檔 =====
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const yesterday = () => { const d = new Date(Date.now() - 864e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function load(){ try { return JSON.parse(localStorage.getItem('cookie') || '{}'); } catch(e){ return {}; } }
function save(){ try { localStorage.setItem('cookie', JSON.stringify(S)); } catch(e){} }
const S = Object.assign({ day: '', draws: [], got: {}, streak: 0, last: '' }, load());
if (S.day !== today()){ S.day = today(); S.draws = []; save(); }

// 每次抽籤的幸運色/數字/小物/任務，用日期＋第幾顆當種子，同一顆籤固定不變
function seeded(str){ let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function makeDraw(){
  const r = seeded(S.day + '#' + S.draws.length + '#' + Math.random());
  const pool = FORTUNES.map((_, i) => i).filter(i => !S.got[i] && !S.draws.some(d => d.i === i));
  const list = pool.length ? pool : FORTUNES.map((_, i) => i);
  const i = list[Math.floor(r() * list.length)];
  const L = window.LUCKY;
  return { i, c: Math.floor(r() * L.colors.length), n: 1 + Math.floor(r() * 99), it: Math.floor(r() * L.items.length), tk: Math.floor(r() * L.tasks.length), done: false };
}

// ===== 畫面 =====
function updateTop(){
  $('streak').textContent = '🔥 ' + Math.max(1, S.streak) + ' 天';
  const left = PER_DAY - S.draws.length;
  $('left').textContent = left > 0 ? `今天還可以開 ${left} 顆` : '今天的籤餅開完囉，明天再來 ♡';
  $('again').disabled = left <= 0;
  $('again').textContent = left > 0 ? `再開一顆（剩 ${left}）` : '明天再來';
}
function showCard(d, isNew){
  const f = FORTUNES[d.i], L = window.LUCKY;
  $('flv').textContent = LV[f.lv]; $('flv').className = 'lv lv' + f.lv;
  $('fno').textContent = 'No.' + String(d.i + 1).padStart(2, '0') + (isNew ? '  ✨新！' : '');
  $('ftext').textContent = f.t;
  const col = L.colors[d.c];
  $('fcolor').innerHTML = `<i class="sw" style="background:${col[1]}"></i>${col[0]}`;
  $('fnum').textContent = d.n;
  $('fitem').textContent = L.items[d.it];
  $('ftask').textContent = L.tasks[d.tk];
  $('task').classList.toggle('done', !!d.done);
  $('task').onclick = () => {
    d.done = !d.done; save(); $('task').classList.toggle('done', d.done);
    if (d.done){ const r = $('task').getBoundingClientRect(); burstAt(r.left + 20, r.top + 10, ['✓', '♡', '✦'], 8); toast('任務完成！你好棒 ♡'); }
  };
  $('card').dataset.idx = S.draws.indexOf(d);
  $('card').classList.add('show');
}
function hideCard(){ $('card').classList.remove('show'); }

// ===== 敲籤餅 =====
let hits = 0, busy = false;
function resetCookie(){
  const c = $('cookie'); c.className = ''; hits = 0; busy = false;
  document.querySelectorAll('.crack').forEach(e => e.classList.remove('on'));
  $('slip').classList.remove('show');
  const left = PER_DAY - S.draws.length;
  $('hint').textContent = left > 0 ? '點點籤餅，把它敲開！' : '籤餅睡著了…明天見 💤';
  $('cookie').style.opacity = left > 0 ? 1 : .55;
}
$('stage').addEventListener('pointerdown', ev => {
  if (busy || $('card').classList.contains('show')) return;
  if (S.draws.length >= PER_DAY){ toast('今天開完了，明天再來喔 ♡'); return; }
  const c = $('cookie'); hits++;
  c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  buzz(12); sfx('tap');
  burstAt(ev.clientX, ev.clientY, ['✦', '✧', '·'], 4);
  if (hits === 1){ document.querySelector('.c1').classList.add('on'); $('hint').textContent = '裂開了！再敲一下！'; }
  if (hits === 2){ document.querySelector('.c2').classList.add('on'); $('hint').textContent = '快開了…最後一下！'; }
  if (hits >= 3){
    busy = true;
    setTimeout(() => {
      c.classList.remove('shake'); c.classList.add('open'); $('slip').classList.add('show');
      sfx('crack'); buzz(30);
      const r = $('stage').getBoundingClientRect();
      burstAt(r.left + r.width / 2, r.top + r.height * .4, ['★', '✦', '♡', '✿'], 14);
      const d = makeDraw(); const isNew = !S.got[d.i];
      S.draws.push(d); S.got[d.i] = 1;
      if (S.last !== S.day){ S.streak = S.last === yesterday() ? S.streak + 1 : 1; S.last = S.day; }
      save(); updateTop();
      $('hint').textContent = LV[FORTUNES[d.i].lv] + '！';
      setTimeout(() => { sfx('chime'); showCard(d, isNew); }, 950);
    }, 180);
  }
});
$('again').onclick = () => { hideCard(); setTimeout(resetCookie, 250); };

// ===== 收藏冊 =====
function openBook(){
  const n = Object.keys(S.got).length, N = FORTUNES.length;
  $('bookSub').textContent = `已收集 ${n} / ${N} 張`;
  $('bookBar').style.width = (n / N * 100) + '%';
  $('book').innerHTML = ''; $('peek').style.display = 'none';
  FORTUNES.forEach((f, i) => {
    const e = document.createElement('div');
    if (S.got[i]){
      e.className = 'slot'; e.style.background = LVC[f.lv];
      e.innerHTML = `<small>${String(i + 1).padStart(2, '0')}</small>${LV[f.lv]}`;
      e.onclick = () => { $('peek').style.display = 'block'; $('peek').innerHTML = `<span style="color:${LVC[f.lv]}">No.${String(i + 1).padStart(2, '0')}　${LV[f.lv]}</span><br>${f.t}`; };
    } else { e.className = 'slot no'; e.textContent = '?'; }
    $('book').appendChild(e);
  });
  $('bookSheet').classList.add('show');
}
$('openBook').onclick = openBook;
$('openToday').onclick = () => {
  const box = $('todayList'); box.innerHTML = '';
  if (!S.draws.length) box.innerHTML = '<p style="color:#c99a76">今天還沒開籤餅喔～</p>';
  S.draws.forEach((d, k) => {
    const f = FORTUNES[d.i], b = document.createElement('div');
    b.className = 'box'; b.style.marginBottom = '8px'; b.style.cursor = 'pointer';
    b.innerHTML = `<b>第 ${k + 1} 顆</b><span style="color:${LVC[f.lv]}">${LV[f.lv]}</span>　<span style="font-weight:600;font-size:14px">${f.t}</span>`;
    b.onclick = () => { $('todaySheet').classList.remove('show'); showCard(d, false); };
    box.appendChild(b);
  });
  $('todaySheet').classList.add('show');
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.sheet').classList.remove('show'));
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) s.classList.remove('show'); }));
$('about').onclick = () => $('aboutSheet').classList.add('show');

// ===== 存成圖片 =====
$('share').onclick = async () => {
  const d = S.draws[+$('card').dataset.idx] || S.draws[S.draws.length - 1]; if (!d) return;
  const f = FORTUNES[d.i], L = window.LUCKY, W = 720, H = 960;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
  g.fillStyle = '#fff4e4'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#f9e2c4'; for (let y = 10; y < H; y += 40) for (let x = 10; x < W; x += 40) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
  g.fillStyle = '#fffdf8'; rr(g, 60, 90, W - 120, H - 180, 44); g.fill();
  g.strokeStyle = '#f3d9bb'; g.lineWidth = 4; g.setLineDash([14, 10]); rr(g, 80, 110, W - 160, H - 220, 34); g.stroke(); g.setLineDash([]);
  const font = 'system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif';
  g.textAlign = 'center';
  g.fillStyle = '#c4733a'; g.font = `800 40px ${font}`; g.fillText('幸運籤餅', W / 2, 190);
  g.fillStyle = LVC[f.lv]; rr(g, W / 2 - 110, 230, 220, 76, 38); g.fill();
  g.fillStyle = '#fff'; g.font = `900 46px ${font}`; g.fillText(LV[f.lv], W / 2, 284);
  g.fillStyle = '#7a4b30'; g.font = `700 34px ${font}`;
  wrap(g, f.t, W / 2, 380, W - 220, 54);
  g.font = `600 26px ${font}`; g.fillStyle = '#b8692f';
  const col = L.colors[d.c];
  g.fillText(`幸運色　${col[0]}　｜　幸運數字　${d.n}`, W / 2, 640);
  g.fillText(`幸運小物　${L.items[d.it]}`, W / 2, 690);
  g.fillText(`今日小任務　${L.tasks[d.tk]}`, W / 2, 740);
  g.fillStyle = '#d1aa86'; g.font = `500 22px ${font}`; g.fillText(S.day + '　No.' + String(d.i + 1).padStart(2, '0'), W / 2, 820);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], '幸運籤餅.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: '幸運籤餅' }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.download = '幸運籤餅.png'; a.href = url; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); toast('圖片存好了 ♡');
};
function rr(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, t, x, y, maxW, lh){ let line = ''; for (const ch of t){ if (g.measureText(line + ch).width > maxW){ g.fillText(line, x, y); line = ch; y += lh; } else line += ch; } g.fillText(line, x, y); }

// ===== 小效果 =====
function burstAt(x, y, chars, n){
  for (let i = 0; i < n; i++){
    const e = document.createElement('div'); e.className = 'fx'; e.textContent = chars[i % chars.length];
    e.style.position = 'fixed'; e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.color = ['#f5a35c', '#f27e7e', '#e7c04a', '#8cc787', '#f7b6c8'][i % 5];
    const a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
    e.style.setProperty('--dx', Math.cos(a) * dist + 'px'); e.style.setProperty('--dy', Math.sin(a) * dist - 20 + 'px');
    e.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
    document.body.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
}
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2400); }
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }
let AC = null;
function sfx(kind){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if (kind === 'tap'){ o.type = 'triangle'; o.frequency.setValueAtTime(520 + hits * 90, t); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .12); o.start(t); o.stop(t + .13); }
    if (kind === 'crack'){ o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + .15); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); o.start(t); o.stop(t + .2); }
    if (kind === 'chime'){ [784, 988, 1319].forEach((f, k) => { const o2 = AC.createOscillator(), g2 = AC.createGain(); o2.type = 'sine'; o2.frequency.value = f; o2.connect(g2); g2.connect(AC.destination); g2.gain.setValueAtTime(0, t + k * .09); g2.gain.linearRampToValueAtTime(.1, t + k * .09 + .02); g2.gain.exponentialRampToValueAtTime(.001, t + k * .09 + .5); o2.start(t + k * .09); o2.stop(t + k * .09 + .55); }); o.disconnect(); }
  } catch(e){}
}

// 跨過午夜自動補充
setInterval(() => { if (S.day !== today()){ S.day = today(); S.draws = []; save(); hideCard(); resetCookie(); updateTop(); toast('新的一天！籤餅補充好了 ♡'); } }, 30000);

// ===== App 安裝 + 自動更新 =====
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;
if (!standalone) $('install').style.display = 'inline-block';
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
addEventListener('appinstalled', () => { $('install').style.display = 'none'; toast('裝好了！去主畫面找我 ♡'); });
$('install').onclick = async () => {
  if (deferred){ deferred.prompt(); await deferred.userChoice; deferred = null; return; }
  $('installSteps').innerHTML = '<p><b>放到主畫面：</b><br>' + (isIOS
    ? '用 Safari 打開 → 按下方「分享」→「加入主畫面」→「新增」'
    : '用 Chrome 打開 → 按右上角「⋮」→「加到主畫面」或「安裝應用程式」') + '</p>';
  $('aboutSheet').classList.add('show');
};
if ('serviceWorker' in navigator){
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    setInterval(check, 60000);
  });
  let re = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had || re) return; re = true; sessionStorage.setItem('upd', '1'); location.reload(); });
  if (sessionStorage.getItem('upd')){ sessionStorage.removeItem('upd'); setTimeout(() => toast('已更新到最新版 ♡'), 400); }
}

updateTop(); resetCookie();
</script>
