<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eef6f3">
<title>紓壓小盒</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="紓壓小盒">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="back" class="icon" aria-label="回首頁">‹</button>
    <h1 id="title">紓壓小盒</h1>
    <button id="sound" class="icon" aria-label="音效">🔊</button>
    <button id="install" class="pill">下載 App</button>
  </header>

  <section id="home">
    <p class="lead">累了嗎？來這裡放鬆一下 ♡</p>
    <div class="cards">
      <button class="card c-wash" data-go="wash">
        <span class="art">🫧</span>
        <span><b>刷刷洗洗</b><small>把髒兮兮的東西刷得亮晶晶</small></span>
        <em id="p-wash"></em>
      </button>
      <button class="card c-sort" data-go="sort">
        <span class="art">🗂️</span>
        <span><b>整理小收納</b><small>把東西放回剛剛好的位置</small></span>
        <em id="p-sort"></em>
      </button>
      <button class="card c-toys" data-go="toys">
        <span class="art">🧸</span>
        <span><b>解壓玩具盒</b><small>泡泡紙、史萊姆、按鈕、陀螺</small></span>
        <em></em>
      </button>
    </div>
    <p class="foot">個人製作・非營利・不收費不放廣告</p>
  </section>

  <section id="game"></section>
  <div id="toast"></div>

<script src="app.js"></script>
<script src="games/wash.js"></script>
<script src="games/sort.js"></script>
<script src="games/toys.js"></script>
<script>App.start();</script>
</body>
</html>
